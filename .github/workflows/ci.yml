name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYO3_NO_PYTHON: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - run: cargo +1.99.1 test --locked
      - run: cargo +1.99.1 clippy --locked --all-targets --features python -- -D warnings

  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: |
            3.12
            3.15.1
      - name: Check both Python executables
        run: |
          python3.12 --version
          python3.15 --version
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          rust-toolchain: 1.99.1
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist --interpreter python3.12
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/cea-wheel-site" dist/*.whl
          cd "$RUNNER_TEMP"
          python3.12 -I "$GITHUB_WORKSPACE/tests/test_wheel.py" --installed "$RUNNER_TEMP/cea-wheel-site"
          python3.15 -I "$GITHUB_WORKSPACE/tests/test_wheel.py" --installed "$RUNNER_TEMP/cea-wheel-site"
      - name: Build source distribution
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          rust-toolchain: 1.99.1
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
