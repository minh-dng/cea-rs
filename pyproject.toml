[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "cea-keplr-rs"
version = "0.1.0a3"
requires-python = ">=3.12"
description = "Rust port of NASA CEA 3.3.4 with a NASA-compatible Python API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "vendor/*LICENSE*", "vendor/thermo-species/LICENSE*"]
dependencies = ["numpy>=1.26"]
classifiers = ["Development Status :: 3 - Alpha", "Topic :: Scientific/Engineering :: Chemistry", "Programming Language :: Rust"]


[project.urls]
Repository = "https://github.com/minh-dng/cea-rs"

[tool.maturin]
features = ["python"]
module-name = "cea_rs._cea_rs"
python-source = "python"
include = ["NOTICE", "docs/**", "tests/**", "scripts/**", {path = "vendor/nasa-transport/trans.inp", format = "sdist"}]
exclude = ["**/._*", "**/.DS_Store", "**/__pycache__/**"]
